# ingest -- from a merged document to an answer in production.
#
#   build -> eval-gate -> publish -> promote-dev -> promote-sit -> promote-pre-prod -> promote-prod
#
# build        titan embeddings, INCREMENTAL on the latest published index (only changed documents are embedded)
# eval-gate    recall@5 >= 0.80 and no drop > 0.05 against the index now in prod; a failure stops the run here
# publish      uploads indexes/<version>/ to the knowledge bucket; an existing version is never overwritten
# promote-*    writes /finrisk/<env>/index, then waits until the app's /ready reports that version
#
# Names this workflow needs (set by finrisk-infra/scripts/github_bootstrap.sh):
#
# | kind                | name                      | value                                                            |
# |---------------------|---------------------------|------------------------------------------------------------------|
# | repository variable | AWS_REGION                | ap-southeast-2 (no account id in it, so it is a variable)        |
# | repository secret   | AWS_KB_BUILD_ROLE_ARN     | role finrisk-kb-build (OIDC; trusts ref:refs/heads/main)         |
# | repository secret   | KB_BUCKET                 | finrisk-kb-<account>-<region>-an (the name holds the account id)  |
# | environment secret  | AWS_ROLE_ARN              | role finrisk-kb-promote-<env>, one in each of dev, sit,          |
# |                     |                           | pre-prod and prod (OIDC; trusts environment:<env>)               |
# | environments        | dev, sit, pre-prod, prod  | pre-prod and prod have a required reviewer; branch policy: main  |
#
# The rule (same in all four repos): a job WITH `environment:` reads the environment secret AWS_ROLE_ARN;
# a job WITHOUT an environment reads a repository secret named after its role (AWS_KB_BUILD_ROLE_ARN).
# The build, eval-gate and publish jobs have no environment, so their OIDC subject is ref:refs/heads/main.

name: ingest

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ingest/**"
      - "eval/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }} # a repository variable (no account id in it), set by github_bootstrap.sh

# Every job runs on ubuntu-24.04, the image this pipeline was rehearsed on. `ubuntu-latest` moves to Ubuntu 26 on
# 19 Oct 2026; pin the runner like you pin actions, and move to a new image on purpose, in a pull request.
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (no network)
        run: python -m pytest
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_KB_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Build the index (titan, incremental on the latest published)
        id: build
        env:
          EMBEDDINGS: titan
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
        run: |
          python -m ingest build --docs docs --out build/index --previous latest
          echo "version=$(python -c "import json; print(json.load(open('build/index/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
          python -m ingest summary --plan build/index/build_plan.json --title "Index build" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: index-built-${{ github.sha }}
          path: build/index
          retention-days: 7
          if-no-files-found: error

  eval-gate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: index-built-${{ github.sha }}
          path: build/index
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_KB_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Evaluate against the evaluation questions (exit 3 = gate failed)
        run: python -m eval.evaluate --index build/index --baseline ssm:/finrisk/prod/index
      - name: Summary
        if: always()
        run: |
          python -m ingest summary --plan build/index/build_plan.json --report build/index/eval_report.json \
            --title "Evaluation gate" --baseline-label prod >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: index-evaluated-${{ github.sha }}
          path: build/index
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: eval-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: index-evaluated-${{ github.sha }}
          path: build/index
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_KB_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Publish indexes/<version>/ (never overwrites)
        id: publish
        env:
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
        run: |
          python -m ingest publish --from build/index
          echo "version=$(python -c "import json; print(json.load(open('build/index/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

  promote-dev:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: kb-promote-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Promote dev (write the pointer, wait for the app)
        env:
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
          VERSION: ${{ needs.publish.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m ingest promote --env dev --version "$VERSION"

  promote-sit:
    needs: [publish, promote-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sit
    concurrency:
      group: kb-promote-sit
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Promote sit (write the pointer, wait for the app)
        env:
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
          VERSION: ${{ needs.publish.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m ingest promote --env sit --version "$VERSION"

  promote-pre-prod:
    needs: [publish, promote-sit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pre-prod        # required reviewer: the run waits here for an approval
    concurrency:
      group: kb-promote-pre-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Promote pre-prod (write the pointer, wait for the app)
        env:
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
          VERSION: ${{ needs.publish.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m ingest promote --env pre-prod --version "$VERSION"

  promote-prod:
    needs: [publish, promote-pre-prod]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod            # required reviewer: the run waits here for an approval
    concurrency:
      group: kb-promote-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask the account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Promote prod (write the pointer, wait for the app)
        env:
          KB_BUCKET: ${{ secrets.KB_BUCKET }}
          VERSION: ${{ needs.publish.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m ingest promote --env prod --version "$VERSION"
